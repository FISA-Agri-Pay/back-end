spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5             # 고정 크기 풀. minimum-idle 미설정 → maximum-pool-size와 동일하게 동작 (서비스 수 × replica × 5 ≈ 50, max_connections 150 대비 여유)
      max-lifetime: 300000             # 5분. PostgreSQL이 idle 커넥션을 끊기 전에 풀에서 먼저 폐기
      keepalive-time: 60000            # 1분마다 커넥션 유효성 확인하여 죽은 커넥션 재사용 방지
      connection-timeout: 3000         # 커넥션 획득 3초 대기 후 타임아웃
      leak-detection-threshold: 30000  # 커넥션을 30초 이상 반납하지 않으면 경고 로그 (누수 진단용, 안정화 후 제거 고려)
  jpa:
    properties:
      hibernate:
        default_schema: core

resident-id:
  hmac-key: ${RESIDENT_ID_HMAC_KEY}
  encryption-key: ${RESIDENT_ID_ENCRYPTION_KEY}

cookie:
  secure: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace_id=%X{trace_id:-} span_id=%X{span_id:-} %logger{36} %kvp - %msg%n"
