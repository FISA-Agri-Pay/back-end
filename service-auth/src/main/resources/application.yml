spring:
  application:
    name: service-auth
  profiles:
    active: local
  mandatory-file-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace_id=%X{trace_id:-} span_id=%X{span_id:-} %logger{36} %kvp - %msg%n"

server:
  port: 8091

jwt:
  secret: ${JWT_SECRET}

resident-id:
  hmac-key: ${RESIDENT_ID_HMAC_KEY:local-development-hmac-key}
  encryption-key: ${RESIDENT_ID_ENCRYPTION_KEY:local-development-encryption-key}

payment-pin-verification:
  transport: ${PAYMENT_PIN_VERIFICATION_TRANSPORT:sqs}
  ttl-seconds: ${PAYMENT_PIN_VERIFICATION_TTL_SECONDS:300}
  sqs:
    queue-url: ${PAYMENT_PIN_VERIFIED_QUEUE_URL:}

cloud:
  aws:
    sqs:
      region: ${AWS_REGION:ap-northeast-2}

cookie:
  secure: true
