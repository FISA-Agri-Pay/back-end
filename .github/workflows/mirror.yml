name: On-Premise Direct Mirror & Deploy

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read

    concurrency:
      group: mirror-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push current branch to GitLab
        run: |
          git remote remove gitlab || true
          git remote add gitlab "${{ secrets.INTERNAL_GITLAB_URL }}"
          git push gitlab HEAD:${GITHUB_REF_NAME} --force

      - name: Cleanup GitLab remote
        if: always()
        run: git remote remove gitlab || true

      - name: Deploy to K0s Cluster
        if: github.ref == 'refs/heads/main'
        run: |
          echo "GitHub Actions 파이프라인 연동 성공! 배포 단계를 대기 중입니다."