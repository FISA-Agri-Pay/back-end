spring:
  datasource:
    core:
      # core primary DB 접속 정보입니다. 쓰기 트랜잭션과 readOnly가 아닌 트랜잭션이 사용합니다.
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      replica:
        # core replica DB 접속 정보입니다. @Transactional(readOnly = true) 조회 트랜잭션이 사용합니다.
        url: ${DB_REPLICA_URL:}
        username: ${DB_REPLICA_USERNAME:${DB_USERNAME}}
        password: ${DB_REPLICA_PASSWORD:${DB_PASSWORD}}
        driver-class-name: org.postgresql.Driver
    catalog:
      # catalog DB는 단일 DB 구성이므로 read/write 라우팅을 적용하지 않습니다.
      url: ${CATALOG_DB_URL}
      username: ${CATALOG_DB_USERNAME}
      password: ${CATALOG_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cloud:
  aws:
    s3:
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경변수로 자격증명을 주입
      region: ${AWS_REGION}
      bucket: ${S3_BUCKET_NAME}
      # 업로드 후 반환할 이미지 공개 URL의 base (예: https://bucket-name.s3.ap-northeast-2.amazonaws.com)
      public-url-prefix: ${S3_PUBLIC_URL_PREFIX}

credit-docs:
  s3:
    bucket: ${CREDIT_DOCS_S3_BUCKET}
    presigned-url-expiry-minutes: 15
