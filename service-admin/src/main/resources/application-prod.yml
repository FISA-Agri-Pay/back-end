spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    properties:
      hibernate:
        default_schema: admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cloud:
  aws:
    s3:
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경변수로 자격증명을 주입
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET_NAME}
      # 업로드 후 반환할 이미지 공개 URL의 base (예: https://bucket-name.s3.ap-northeast-2.amazonaws.com)
      public-url-prefix: ${S3_PUBLIC_URL_PREFIX}

credit-docs:
  s3:
    bucket: ${CREDIT_DOCS_S3_BUCKET:kkpp-secure-credit-docs-bucket}
    presigned-url-expiry-minutes: 15
