spring:
  application:
    name: service-core
  profiles:
    active: local
  mandatory-file-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      force: true

server:
  port: 8090

jwt:
  secret: ${JWT_SECRET:local-development-secret-key}

logging:
  charset:
    console: UTF-8
    file: UTF-8
