jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-do-not-use-in-production-min32}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkpp}
    username: ${DB_USERNAME:kkpp}
    password: ${DB_PASSWORD:kkpp}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
