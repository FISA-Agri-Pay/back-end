spring:
  application:
    name: service-catalog
  profiles:
    active: local

server:
  port: 8081

catalog:
  kafka:
    payment-request-timeout-seconds: ${PAYMENT_REQUEST_KAFKA_TIMEOUT_SECONDS:10}

payment-request:
  transport: ${PAYMENT_REQUEST_TRANSPORT:kafka}
  sqs:
    queue-url: ${PAYMENT_REQUEST_QUEUE_URL:}

cloud:
  aws:
    sqs:
      region: ${AWS_REGION:ap-northeast-2}
