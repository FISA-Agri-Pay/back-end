spring:
  application:
    name: service-catalog
  profiles:
    active: local

server:
  port: 8081

catalog:
  kafka:
    payment-request-timeout-seconds: ${PAYMENT_REQUEST_KAFKA_TIMEOUT_SECONDS:10}

payment-request:
  transport: ${PAYMENT_REQUEST_TRANSPORT:kafka}
  sqs:
    queue-url: ${PAYMENT_REQUEST_QUEUE_URL:}

payment-pin-verification:
  consumer:
    enabled: ${PAYMENT_PIN_VERIFICATION_CONSUMER_ENABLED:false}
  sqs:
    queue-url: ${PAYMENT_PIN_VERIFIED_QUEUE_URL:}
    max-number-of-messages: ${PAYMENT_PIN_VERIFICATION_SQS_MAX_NUMBER_OF_MESSAGES:5}
    wait-time-seconds: ${PAYMENT_PIN_VERIFICATION_SQS_WAIT_TIME_SECONDS:20}
    poll-delay-millis: ${PAYMENT_PIN_VERIFICATION_SQS_POLL_DELAY_MILLIS:1000}

cloud:
  aws:
    sqs:
      region: ${AWS_REGION:ap-northeast-2}
