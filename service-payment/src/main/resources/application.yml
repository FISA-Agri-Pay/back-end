spring:
  application:
    name: service-payment
  profiles:
    active: local
  mandatory-file-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      force: true

server:
  port: 8092

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace_id=%X{trace_id:-} span_id=%X{span_id:-} %logger{36} %kvp - %msg%n"

payment-request:
  transport: ${PAYMENT_REQUEST_TRANSPORT:kafka}
  sqs:
    queue-url: ${PAYMENT_REQUEST_QUEUE_URL:}
    max-number-of-messages: ${PAYMENT_REQUEST_SQS_MAX_NUMBER_OF_MESSAGES:5}
    wait-time-seconds: ${PAYMENT_REQUEST_SQS_WAIT_TIME_SECONDS:20}
    poll-delay-millis: ${PAYMENT_REQUEST_SQS_POLL_DELAY_MILLIS:1000}

cloud:
  aws:
    sqs:
      region: ${AWS_REGION:ap-northeast-2}
